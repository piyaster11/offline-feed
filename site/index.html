<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Offline Feed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Offline Feed</title>
<style>
:root{--bg:#000;--card:#121214;--line:#232327;--fg:#ececf1;--dim:#9a9aa5;--acc:#ff4d6d;--acc2:#3ea6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:6px;padding:6px 10px}
.bar h1{font-size:19px;margin:0;flex:1;font-weight:800;letter-spacing:-.3px}
.ib{min-width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative}
.ib.on{background:#24242a;color:var(--acc2)}
.tabs{display:flex;gap:4px;padding:0 10px 6px}
.tab{flex:1;height:40px;border-radius:10px;font-weight:700;color:var(--dim);background:#0d0d10}
.tab.on{color:#fff;background:#26262c}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 10px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;background:#16161a;border:1px solid var(--line);color:var(--dim);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--fg);color:#000;border-color:var(--fg)}
#status{font-size:13px;color:var(--dim);padding:0 12px 6px;display:none}
#status.show{display:block}
.prog{height:4px;background:#222;border-radius:2px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;width:0;background:var(--acc2);transition:width .3s}
main{max-width:640px;margin:0 auto;padding:8px 0 40px}
.post{background:var(--card);margin:0 0 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media(min-width:660px){.post{border:1px solid var(--line);border-radius:14px;overflow:hidden}}
.meta{display:flex;align-items:center;gap:8px;padding:10px 14px 4px;font-size:13px;color:var(--dim)}
.src{font-weight:700;color:#fff;background:#2a2a30;border-radius:6px;padding:2px 7px;font-size:12px}
.src.g{background:#0a5c36}.src.r{background:#7a2a12}
.seenb{margin-left:auto;font-size:12px}
.title{padding:2px 14px 10px;font-size:17px;font-weight:650;word-wrap:break-word}
.mw{position:relative;background:#050506;min-height:120px;display:flex;justify-content:center}
.mw img,.mw video{display:block;width:100%;height:auto;max-height:none}
.mw video{max-height:82vh;object-fit:contain;background:#000}
.snd{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:22px;background:rgba(0,0,0,.65);font-size:20px;display:flex;align-items:center;justify-content:center}
.badge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.65);border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700}
.top{margin:8px 14px 0;padding:8px 10px;background:#1b1b20;border-radius:10px;font-size:14px;color:#cfcfd6}
.top b{color:var(--acc2);font-weight:600}
.acts{display:flex;gap:4px;padding:6px 8px 8px}
.act{flex:1;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;color:var(--dim);background:#18181c}
.act.saved{color:var(--acc)}
.empty{padding:60px 24px;text-align:center;color:var(--dim)}
.empty .big{font-size:48px}
.btn{display:inline-block;margin-top:14px;padding:14px 22px;border-radius:14px;background:var(--acc2);color:#000;font-weight:800;font-size:16px}
.btn.sec{background:#26262c;color:#fff}
.btn.red{background:#3a1218;color:#ff8b9b}
#sheet,#viewer{position:fixed;inset:0;z-index:50;display:none}
#sheet.show,#viewer.show{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#sheet .pan{position:absolute;left:0;right:0;bottom:0;background:#141417;border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
#sheet h2{margin:0 0 8px;font-size:20px}
#sheet p{color:var(--dim);font-size:14px;margin:6px 0}
#sheet .row{display:flex;flex-wrap:wrap;gap:8px}
#viewer{background:#000;overflow:auto;-webkit-overflow-scrolling:touch}
#viewer .vin{min-height:100%;display:flex;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top)) 0 calc(70px + env(safe-area-inset-bottom))}
#viewer img,#viewer video{width:100%;height:auto;display:block;-webkit-touch-callout:default;user-select:auto}
#viewer .x{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;width:48px;height:48px;border-radius:24px;background:rgba(40,40,46,.9);font-size:22px;z-index:2}
#viewer .hint{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));text-align:center;font-size:14px;color:#ddd;background:linear-gradient(transparent,rgba(0,0,0,.9))}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a2a30;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#sent{height:1px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Offline Feed</h1>
    <button class="ib" id="bShuf" title="Shuffle" aria-label="Shuffle">🔀</button>
    <button class="ib" id="bSeen" title="Hide seen" aria-label="Hide seen">👁</button>
    <button class="ib" id="bDl" title="Download / storage" aria-label="Download">⬇️</button>
  </div>
  <div class="tabs"><button class="tab on" data-tab="feed">Feed</button><button class="tab" data-tab="saved">♥ Saved <span id="savedN"></span></button></div>
  <div class="chips" id="chips"></div>
  <div id="status"><span id="stTxt"></span><div class="prog"><i id="stBar"></i></div></div>
</header>
<main id="list"></main>
<div id="sent"></div>
<div id="sheet"><div class="bg"></div><div class="pan" id="pan"></div></div>
<div id="viewer"><button class="x" aria-label="Close">✕</button><div class="vin" id="vin"></div><div class="hint" id="vhint"></div></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
